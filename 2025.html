<!DOCTYPE html>
<html lang="en-GB">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            background-color: #000000;
            margin: 0;
            margin-top: 20px;
            padding: 0;
            font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            position: relative;
            text-align: center;
            color: #fccfa1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            max-width: 800px;
            width: 90%;
        }

        .instagram {
            position: absolute;
            width: 40px;
            bottom: 0%;
            right: 10%;
        }

        .textcenter {
            font-size: 1.5em;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: bold;
            margin-top: 20px;
            width: inherit;
        }

        .textcenter a {
            color: #fccfa1;
            text-decoration: none;
            font-size: 1em;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .textcenter a:hover {
            color: #89a090;
        }

        .logo {
            max-width: 80%;
            max-height: 80%;
            margin-top: 20px;
        }

        .first-text,
        .second-text,
        .third-text {
            margin-bottom: 0;
            position: relative;
        }

        .copyright {
            margin-top: 50px;
            position: relative;
        }


        .copyright {
            font-size: small;
            bottom: 0;
        }

        .aligncenter img {
            max-width: 100%;
            max-height: 100%;
        }

        .thankyou {
            text-align: left;
        }

        .thankyou a {
            color: #fccfa1;
            font-weight: bolder;
            font-size: 1em;
            letter-spacing: 1px;
        }

        @media (max-width: 600px) {
            .textcenter {
                font-size: 1em;
            }

            .textcenter a {
                font-size: 0.6em;
            }

            img {
                max-width: 400px;
            }

            .copyright {
                bottom: 0%
            }

            .instagram {
                width: 20px;
                padding-bottom: 10px;
                right: 10%;
            }
        }

        @media (max-width: 400px) {
            .textcenter {
                font-size: 1em;
            }

            .textcenter a {
                font-size: 0.6em;
            }

            .copyright {
                bottom: 0%
            }
        }

        .prev-pigpits a {
            font-size: medium;
        }

        #schedule-drawer {
            position: fixed;
            top: 60px;
            /* Lower the drawer */
            right: 0;
            z-index: 2000;
        }

        #open-schedule {
            position: relative;
            z-index: 1;
            background: #fccfa1;
            color: #222;
            border: none;
            border-radius: 8px 0 0 8px;
            padding: 12px 18px;
            font-size: 1.2em;
            cursor: pointer;
            box-shadow: -2px 2px 8px rgba(0, 0, 0, 0.2);
            transition: background 0.2s;
            overflow: visible;
            display: block;
        }

        .rainbow-border {
            display: inline-block;
            padding: 3px;
            /* thickness of the border */
            border-radius: 14px 6px 6px 14px;
            background: conic-gradient(red, orange, yellow, lime, cyan, blue, violet, red);
            background-size: 200% 200%;
            animation: rainbow-move 2s linear infinite;
        }

        @keyframes rainbow-move {
            100% {
                background-position: 200% 0;
            }
        }

        #open-schedule:hover {
            background: #ffe3c2;
        }

        #drawer-content {
            position: fixed;
            top: 60px;
            right: -360px;
            width: 320px;
            max-width: 90vw;
            height: auto;
            max-height: 80vh;
            background: #222;
            color: #fccfa1;
            box-shadow: -20px 0 40px 0 #fccfa1;
            padding: 32px 24px 24px 24px;
            transition: right 0.3s cubic-bezier(.4, 2, .6, 1);
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            border-top-left-radius: 24px;
            border-bottom-left-radius: 24px;
            z-index: 2001;
        }

        #drawer-content.open {
            right: 0;
        }

        @media (max-width: 600px) {
            #drawer-content {
                top: 0;
                right: -100vw;
                width: 100vw;
                max-width: 100vw;
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
                padding: 18px 8px 8px 8px;
            }

            #drawer-content.open {
                right: 0;
            }
        }

        /* Responsive schedule button */
        .rainbow-border {
            display: inline-block;
            padding: 3px;
            border-radius: 14px 6px 6px 14px;
            background: conic-gradient(red, orange, yellow, lime, cyan, blue, violet, red);
            background-size: 200% 200%;
            animation: rainbow-move 2s linear infinite;
        }

        @keyframes rainbow-move {
            100% {
                background-position: 200% 0;
            }
        }

        #open-schedule {
            position: relative;
            z-index: 2002;
            background: #fccfa1;
            color: #222;
            border: none;
            border-radius: 8px 0 0 8px;
            padding: 12px 18px;
            font-size: 1.2em;
            cursor: pointer;
            box-shadow: -2px 2px 8px rgba(0, 0, 0, 0.2);
            transition: background 0.2s;
            overflow: visible;
            display: block;
        }

        .rainbow-border.hidden {
            display: none;
        }

        @media (max-width: 600px) {
            .rainbow-border {
                border-radius: 12px;
                padding: 2px;
            }

            #open-schedule {
                border-radius: 8px;
                padding: 10px 14px;
                font-size: 1em;
            }
        }

        @media (max-width: 600px) {
            #schedule-drawer {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                width: 100vw;
                z-index: 3000;
                display: flex;
                flex-direction: column;
                align-items: center;
                pointer-events: none;
                /* Only allow pointer events on children */
            }

            .rainbow-border {
                margin: 10px auto 0 auto;
                border-radius: 16px;
                padding: 2px;
                display: flex;
                justify-content: center;
                align-items: center;
                width: max-content;
                pointer-events: auto;
            }

            #open-schedule {
                border-radius: 12px;
                padding: 12px 24px;
                font-size: 1.2em;
                margin: 0 auto;
                display: block;
                position: static;
                width: auto;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            }

            #drawer-content {
                position: fixed;
                top: -100vh;
                left: 0;
                right: 0;
                width: 100vw;
                height: auto;
                max-height: 90vh;
                border-radius: 0 0 24px 24px;
                box-shadow: 0 8px 32px 0 #fccfa1;
                padding: 32px 12px 24px 12px;
                transition: top 0.35s cubic-bezier(.4, 2, .6, 1);
                z-index: 3001;
                margin: 0 auto;
                background: #222;
                pointer-events: auto;
            }

            #drawer-content.open {
                top: 0;
            }
        }

        #close-schedule {
            position: absolute;
            top: 18px;
            right: 18px;
            background: none;
            border: none;
            color: #fccfa1;
            font-size: 2em;
            cursor: pointer;
        }

        #drawer-content h2 {
            margin-top: 0;
            margin-bottom: 18px;
            font-size: 1.5em;
            color: #fccfa1;
            text-align: left;
        }

        #drawer-content ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #drawer-content li {
            margin-bottom: 14px;
            font-size: 1.1em;
            color: #fff;
        }

        @media (max-width: 500px) {

            #drawer-content,
            #open-schedule {
                width: 90vw;
                font-size: 1em;
            }

            #drawer-content {
                padding: 18px 8px 8px 8px;
            }
        }

        .schedule-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .schedule-list li {
            display: flex;
            flex-direction: row;
            align-items: baseline;
            margin-bottom: 14px;
            font-size: 1.1em;
            color: #fff;
            gap: 16px;
        }

        .sched-time {
            min-width: 70px;
            font-weight: bold;
            color: #fccfa1;
            text-align: right;
            flex-shrink: 0;
        }

        .sched-artist {
            color: #fff;
            font-weight: normal;
            text-align: left;
            flex: 1;
        }
    </style>
    <script type="module" src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="./sheet-fetch.js"></script>
    <script src="./drawer.js"></script>
</head>

<body>
    <div class="container">
        <p class="aligncenter">
            <img class="logo" src="resources/2025/pigpitflyer.jpg" alt="Pig Pit 2025 Flyer" />
        <p class="textcenter first-text">
            <a href="https://partiful.com/e/FGdm4aleFjPNykgAk5qr"><u>The Invite</u></a> -
            <a
                href="https://docs.google.com/spreadsheets/d/1gDBTGcBYYvILIlibAdE644tW91NtpIKnV2Ukdhn4BHI/edit?gid=0#gid=0"><u>Add
                    your food</u></a>
        </p>
        <div>
            <canvas id="meal-counts"></canvas>
        </div>
        </p>
        <p class="textcenter second-text">
            <a href="volunteers.html"><u>Our amazing volunteers</u></a>
        </p>
        <p class="textcenter third-text">
            <a href="costs.html"><u>What does it take to put on pig pit?</u></a>
        </p>

        <a class="instagram" target="_blank" href="https://www.instagram.com/pigpit.family/"><img
                src="resources/Instagram_Glyph_White.svg" /></a>
        <p class="copyright">
            Brought to you by Pig Pit Oinc.
        </p>
    </div>
    <div id="schedule-drawer">
        <div class="rainbow-border">
            <button id="open-schedule" aria-label="Open schedule">&#9776; Schedule</button>
        </div>
        <div id="drawer-content">
            <button id="close-schedule" aria-label="Close schedule">&times;</button>
            <h2>Pig Pit Schedule</h2>
            <ul class="schedule-list">
                <li><span class="sched-time">12pm:</span><span class="sched-artist">JV</span></li>
                <li><span class="sched-time">2pm:</span><span class="sched-artist">BUPP! & Pig Pull</span></li>
                <li><span class="sched-time">4pm:</span><span class="sched-artist">Mr. Vale's Math Class & Yoga</span>
                </li>
                <li><span class="sched-time">5:30pm:</span><span class="sched-artist">DJ JT</span></li>
                <li><span class="sched-time">7:30pm:</span><span class="sched-artist">Balcony Bridge & Grill Pull</span>
                </li>
                <li><span class="sched-time">9pm:</span><span class="sched-artist">DJ JCKLOT</span></li>
            </ul>
        </div>
    </div>
</body>

</html>
