<!DOCTYPE html>
<html lang="en-GB">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            background-color: #000000;
            margin: 0;
            margin-top: 20px;
            padding: 0;
            font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            position: relative;
            text-align: center;
            color: #fccfa1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            max-width: 800px;
            width: 90%;
        }

        .instagram {
            position: absolute;
            width: 40px;
            bottom: 0%;
            right: 10%;
        }

        .textcenter {
            font-size: 1.5em;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: bold;
            margin-top: 20px;
            width: inherit;
        }

        .textcenter a {
            color: #fccfa1;
            text-decoration: none;
            font-size: 1em;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .textcenter a:hover {
            color: #89a090;
        }

        .logo {
            max-width: 80%;
            max-height: 80%;
            margin-top: 20px;
        }

        .first-text,
        .second-text,
        .third-text {
            margin-bottom: 0;
            position: relative;
        }

        .copyright {
            margin-top: 50px;
            position: relative;
        }


        .copyright {
            font-size: small;
            bottom: 0;
        }

        .aligncenter img {
            max-width: 100%;
            max-height: 100%;
        }

        .thankyou {
            text-align: left;
        }

        .thankyou a {
            color: #fccfa1;
            font-weight: bolder;
            font-size: 1em;
            letter-spacing: 1px;
        }

        @media (max-width: 600px) {
            .textcenter {
                font-size: 1em;
            }

            .textcenter a {
                font-size: 0.6em;
            }

            img {
                max-width: 400px;
            }

            .copyright {
                bottom: 0%
            }

            .instagram {
                width: 20px;
                padding-bottom: 10px;
                right: 10%;
            }
        }

        @media (max-width: 400px) {
            .textcenter {
                font-size: 1em;
            }

            .textcenter a {
                font-size: 0.6em;
            }

            .copyright {
                bottom: 0%
            }
        }

        .prev-pigpits a {
            font-size: medium;
        }
    </style>
    <script type="module" src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="./sheet-fetch.js"></script>
</head>

<body>
    <div class="container">
        <p class="aligncenter">
            <img class="logo" src="resources/2025/pigpitflyer.jpg" alt="Pig Pit 2025 Flyer" />
        <p class="textcenter first-text">
            <a href="https://partiful.com/e/FGdm4aleFjPNykgAk5qr"><u>The Invite</u></a> -
            <a
                href="https://docs.google.com/spreadsheets/d/1gDBTGcBYYvILIlibAdE644tW91NtpIKnV2Ukdhn4BHI/edit?gid=0#gid=0"><u>Add
                    your food</u></a>
        </p>
        <div>
            <canvas id="meal-counts"></canvas>
        </div>
        </p>
        <p class="textcenter second-text">
            <a href="volunteers.html"><u>Our amazing volunteers</u></a>
        </p>
        <p class="textcenter third-text">
            <a href="costs.html"><u>What does it take to put on pig pit?</u></a>
        </p>

        <a class="instagram" target="_blank" href="https://www.instagram.com/pigpit.family/"><img
                src="resources/Instagram_Glyph_White.svg" /></a>
        <p class="textcenter third-text prev-pigpits">
            Previous Pig Pits
            </br>
            <a href="2024.html"><u>Pig Pit 2024</u></a>
        </p>

        <p class="copyright">
            Brought to you by Pig Pit Oinc.
        </p>
    </div>
</body>

</html>
