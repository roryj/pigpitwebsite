<!DOCTYPE html>
<html lang="en-GB">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Rock+Salt&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            margin: 0;
            margin-top: 20px;
            padding: 0;
            font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            position: relative;
            text-align: center;
            color: #fccfa1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            max-width: 800px;
            width: 90%;
        }

        .instagram {
            position: absolute;
            width: 40px;
            bottom: 0%;
            right: 10%;
        }

        .textcenter {
            font-size: 1.5em;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: bold;
            margin-top: 20px;
            width: inherit;
        }

        .textcenter a {
            color: #fccfa1;
            text-decoration: none;
            font-size: 1em;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .textcenter a:hover {
            color: #89a090;
        }

        .first-text,
        .second-text,
        .third-text {
            margin-bottom: 0;
            position: relative;
        }

        .copyright {
            margin-top: 50px;
            position: relative;
            font-size: small;
            bottom: 0;
        }

        .prev-pigpits a {
            font-size: medium;
        }

        @media (max-width: 600px) {
            .textcenter {
                font-size: 1em;
            }

            .textcenter a {
                font-size: 0.6em;
            }

            .copyright {
                bottom: 0%
            }

            .instagram {
                width: 20px;
                padding-bottom: 10px;
                right: 10%;
            }
        }

        @media (max-width: 400px) {
            .textcenter {
                font-size: 1em;
            }

            .textcenter a {
                font-size: 0.6em;
            }

            .copyright {
                bottom: 0%
            }
        }

        .hero {
            position: relative;
            width: 100%;
            margin-top: 20px;
        }

        .hero img {
            width: 100%;
            display: block;
            max-width: 100%;
        }

        .hero-overlay-top {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px 16px 50px;
            background: linear-gradient(rgba(0, 0, 0, 0.78), transparent);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero-overlay-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 40px 16px 22px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.82));
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero-title {
            font-family: 'Permanent Marker', cursive;
            font-size: 5.5em;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            line-height: 0.95;
            display: inline-block;
            transform: rotate(-2deg);
            text-shadow:
                0 0 8px rgba(255, 255, 255, 0.6),
                0 0 20px rgba(255, 255, 255, 0.3),
                3px 3px 0 #cc0000,
                6px 6px 0 rgba(0, 0, 0, 0.5),
                -1px -1px 0 #000,
                1px -1px 0 #000,
                -1px 1px 0 #000,
                1px 1px 0 #000;
            filter: blur(0.3px);
        }

        .hero-date {
            font-family: 'Rock Salt', cursive;
            font-size: 2.4em;
            color: rgba(255, 100, 20, 0.95);
            letter-spacing: 2px;
            margin: 0;
            display: block;
            transform: rotate(-2deg);
            text-shadow:
                0 0 6px rgba(255, 70, 0, 1),
                0 0 14px rgba(255, 80, 0, 0.7),
                0 0 28px rgba(255, 100, 0, 0.4),
                0 0 48px rgba(255, 80, 0, 0.15),
                2px 4px 10px rgba(0, 0, 0, 0.7);
            filter: blur(0.5px);
        }

        @media (max-width: 600px) {
            .hero-title {
                font-size: 3em;
                letter-spacing: 1px;
            }

            .hero-date {
                font-size: 1.4em;
                letter-spacing: 1px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="hero">
            <img src="resources/2026/pigpit2026-logo.png" alt="Pig Pit 2026" />
            <div class="hero-overlay-top">
                <span class="hero-title">Pig Pit 2026</span>
            </div>
            <div class="hero-overlay-bottom">
                <span class="hero-date">Saturday &middot; July 25th &middot; 2026</span>
            </div>
        </div>

        <p class="textcenter first-text">
            <a href="volunteers.html"><u>Our amazing volunteers</u></a>
        </p>
        <p class="textcenter second-text">
            <a href="costs.html"><u>What does it take to put on pig pit?</u></a>
        </p>

        <a class="instagram" target="_blank" href="https://www.instagram.com/pigpit.family/"><img
                src="resources/Instagram_Glyph_White.svg" /></a>
        <p class="textcenter third-text prev-pigpits">
            Previous Pig Pits
            </br>
            <a href="2024.html"><u>2024</u></a>
            <a href="2025.html"><u>2025</u></a>
        </p>

        <p class="copyright">
            Brought to you by Pig Pit Oinc.
        </p>
    </div>
</body>

</html>
